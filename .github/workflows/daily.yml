name: Cap nhat gia VGA

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python update_prices.py
      - name: Luu du lieu moi
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json data.js
          git diff --cached --quiet || git commit -m "Cap nhat gia $(date +%F)"
          git push
