<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giá card màn hình RTX 30 / 40 / 50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f6f2; --card: #ffffff; --ink: #17231d; --muted: #5d6b63;
    --line: #d9ded6; --accent: #1c5d45; --down: #0b8a52; --up: #c0392b; --focus: #1a6dd9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121714; --card: #1b221e; --ink: #eaf0ea; --muted: #9aa89f;
      --line: #2c3731; --accent: #6fd3a5; --down: #4fd18f; --up: #ff8a7a; --focus: #6ea8ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Be Vietnam Pro", system-ui, "Segoe UI", sans-serif; line-height: 1.5; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 800; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }

  .lowest { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 26px; }
  .low { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
  .low img { width: 56px; height: 56px; object-fit: contain; background: #fff; border-radius: 6px; flex: none; }
  .low b { display: block; font-size: 1rem; color: var(--accent); }
  .low .p { font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .low .n { font-size: .8rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .tabs button { border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 500; padding: 9px 14px; cursor: pointer; border-right: 1px solid var(--line); }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--paper); font-weight: 700; }
  input, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
  input { flex: 1; min-width: 160px; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .list { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .item { border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .head { width: 100%; display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center; text-align: left; border: 0; background: transparent; color: inherit; font: inherit; padding: 12px 16px; cursor: pointer; }
  .head:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .thumb { width: 76px; height: 76px; border-radius: 8px; background: #fff; border: 1px solid var(--line); object-fit: contain; }
  .thumb.none { display: grid; place-items: center; color: var(--muted); font-size: .7rem; text-align: center; background: var(--paper); }
  .name { font-weight: 500; }
  .tag { color: var(--accent); font-weight: 700; margin-right: 8px; }
  .meta { font-size: .82rem; color: var(--muted); margin-top: 2px; }
  .meta.down { color: var(--down); font-weight: 700; }
  .meta.up { color: var(--up); font-weight: 700; }
  .price { text-align: right; font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .old { display: block; text-decoration: line-through; color: var(--muted); font-weight: 400; font-size: .8rem; }

  .detail { padding: 4px 16px 18px; }
  .detail[hidden] { display: none; }
  .ctl { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .range button { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 5px 12px; cursor: pointer; }
  .range button:first-child { border-radius: 6px 0 0 6px; } .range button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .range button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
  .chartbox { position: relative; }
  .chartbox svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font-size: .8rem; padding: 5px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -120%); display: none; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 10px 0 12px; }
  .stats div { font-size: .78rem; color: var(--muted); }
  .stats b { display: block; font-size: .98rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .note { font-size: .82rem; color: var(--muted); margin: 6px 0 10px; }
  .go { display: inline-block; font-weight: 700; color: var(--accent); }
  .empty { padding: 30px 18px; color: var(--muted); }
  .empty code { background: var(--paper); padding: 2px 6px; border-radius: 4px; }
  footer { margin-top: 18px; font-size: .82rem; color: var(--muted); }
  @media (max-width: 640px) {
    .lowest { grid-template-columns: 1fr; }
    .tabs { width: 100%; } .tabs button { flex: 1; padding: 9px 6px; }
    .head { grid-template-columns: 60px 1fr; }
    .thumb { width: 60px; height: 60px; }
    .price { grid-column: 2; text-align: left; }
    .old { display: inline; margin-right: 8px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Giá card màn hình RTX 30 / 40 / 50</h1>
  <p class="sub" id="sub">Đang tải dữ liệu…</p>
  <section class="lowest" id="lowest" aria-label="Giá thấp nhất theo thế hệ"></section>
  <div class="bar">
    <div class="tabs" id="tabs">
      <button data-s="all" aria-pressed="true">Tất cả</button>
      <button data-s="RTX 50" aria-pressed="false">RTX 50</button>
      <button data-s="RTX 40" aria-pressed="false">RTX 40</button>
      <button data-s="RTX 30" aria-pressed="false">RTX 30</button>
    </div>
    <input id="q" type="search" placeholder="Tìm theo tên, ví dụ 5060 Ti" aria-label="Tìm card">
    <select id="sort" aria-label="Sắp xếp">
      <option value="asc">Giá thấp đến cao</option>
      <option value="desc">Giá cao đến thấp</option>
      <option value="drop">Giảm giá nhiều nhất</option>
      <option value="name">Tên A-Z</option>
    </select>
  </div>
  <div class="list" id="list"></div>
  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  var data = window.PRICE_DATA;
  var list = document.getElementById("list");
  var state = { s: "all", q: "", sort: "asc" };
  var NS = "http://www.w3.org/2000/svg";
  var fmt = function (n) { return n.toLocaleString("vi-VN") + "đ"; };
  var fmtTr = function (n) { return (n / 1e6).toLocaleString("vi-VN", { maximumFractionDigits: 2 }) + " tr"; };
  var dmy = function (iso) { var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; };
  var dm = function (iso) { var p = iso.split("-"); return p[2] + "/" + p[1]; };
  var tms = function (iso) { return Date.parse(iso + "T00:00:00"); };
  var clean = function (n) { return n.replace(/^Card màn hình\s*/i, ""); };

  if (!data || !data.items || !data.items.length) {
    document.getElementById("sub").textContent = "Chưa có dữ liệu giá.";
    list.innerHTML = '<div class="empty">Chạy <code>run_daily.bat</code> trong thư mục này, rồi tải lại trang.</div>';
    return;
  }
  document.getElementById("sub").textContent = "Kiểm tra lần cuối " + data.updated + ", nguồn " + data.source + ". " + data.items.length + " sản phẩm.";
  document.getElementById("foot").textContent = "Giá lấy tự động từ trang bán hàng, có thể khác giá thực tế khi mua. Hãy mở link để kiểm tra lại. Đồ thị chỉ có dữ liệu từ ngày bạn bắt đầu chạy cập nhật.";

  function thumb(src, cls) {
    if (!src) { var d = document.createElement("div"); d.className = cls + " none"; d.textContent = "Chưa có ảnh"; return d; }
    var im = document.createElement("img");
    im.className = cls; im.src = src; im.alt = ""; im.loading = "lazy"; im.referrerPolicy = "no-referrer";
    im.onerror = function () { im.replaceWith(thumb(null, cls)); };
    return im;
  }

  // Ba ô giá thấp nhất
  var low = document.getElementById("lowest");
  ["RTX 50", "RTX 40", "RTX 30"].forEach(function (s) {
    var best = data.items.filter(function (i) { return i.series === s; })[0];
    var box = document.createElement("div"); box.className = "low";
    var txt = document.createElement("div");
    var b = document.createElement("b"); b.textContent = s + " rẻ nhất";
    var p = document.createElement("div"); p.className = "p";
    var n = document.createElement("div"); n.className = "n";
    if (best) { p.textContent = fmt(best.price); n.textContent = clean(best.name); box.appendChild(thumb(best.image, "lowimg")); }
    else { p.textContent = "Chưa có hàng"; n.textContent = "Không thấy " + s + " trong lần cập nhật này"; }
    txt.append(b, p, n); box.appendChild(txt);
    low.appendChild(box);
  });
  low.querySelectorAll(".lowimg").forEach(function (e) { e.className = ""; });

  // ---- Đồ thị giá kiểu chứng khoán ----
  function buildChart(box, item, days) {
    box.textContent = "";
    var all = item.hist.map(function (h) { return { t: tms(h[0]), d: h[0], p: h[1] }; });
    var end = all[all.length - 1].t, start = end - days * 864e5;
    var pts = all.filter(function (x) { return x.t >= start; });
    var before = all.filter(function (x) { return x.t < start; }).pop();
    if (before) pts.unshift({ t: start, d: null, p: before.p });
    var t0 = pts[0].t, t1 = end;
    if (pts.length < 2 || t1 === t0) {
      var m = document.createElement("div"); m.className = "note";
      m.textContent = "Mới có 1 ngày dữ liệu (" + dmy(all[0].d) + "). Đồ thị sẽ đầy dần mỗi ngày bạn chạy cập nhật.";
      box.appendChild(m); return { pts: pts };
    }
    var W = 700, H = 250, L = 10, R = 62, T = 14, B = 26;
    var ps = pts.map(function (x) { return x.p; });
    var mn = Math.min.apply(null, ps), mx = Math.max.apply(null, ps);
    var pad = (mx - mn) * 0.18 || mx * 0.02; var lo = mn - pad, hi = mx + pad;
    var X = function (t) { return L + (t - t0) / (t1 - t0) * (W - L - R); };
    var Y = function (p) { return T + (1 - (p - lo) / (hi - lo)) * (H - T - B); };
    var first = pts[0].p, last = pts[pts.length - 1].p;
    var col = last < first ? "var(--down)" : last > first ? "var(--up)" : "var(--accent)";

    var d = "M" + X(pts[0].t) + " " + Y(pts[0].p);
    for (var i = 1; i < pts.length; i++) d += " H" + X(pts[i].t) + " V" + Y(pts[i].p);
    d += " H" + X(t1);
    var area = d + " V" + (H - B) + " H" + X(t0) + " Z";
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Đồ thị giá ' + days + ' ngày, từ ' + fmt(first) + ' đến ' + fmt(last) + ', thấp nhất ' + fmt(mn) + ', cao nhất ' + fmt(mx) + '">';
    svg += '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + col + '" stop-opacity=".28"/><stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>';
    for (var k = 0; k <= 3; k++) {
      var v = lo + (hi - lo) * k / 3, y = Y(v);
      svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-dasharray="3 4"/>';
      svg += '<text x="' + (W - R + 6) + '" y="' + (y + 4) + '" font-size="11" fill="var(--muted)">' + fmtTr(v) + '</text>';
    }
    svg += '<path d="' + area + '" fill="url(#g)"/>';
    svg += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2.2" stroke-linejoin="round"/>';
    svg += '<text x="' + L + '" y="' + (H - 6) + '" font-size="11" fill="var(--muted)">' + dm(new Date(t0).toISOString().slice(0, 10)) + '</text>';
    svg += '<text x="' + (W - R) + '" y="' + (H - 6) + '" font-size="11" fill="var(--muted)" text-anchor="end">' + dm(item.hist[item.hist.length - 1][0]) + '</text>';
    svg += '<line id="cx" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--muted)" style="display:none"/>';
    svg += '<circle id="cd" r="4.5" fill="' + col + '" stroke="var(--card)" stroke-width="2" style="display:none"/>';
    svg += '<rect x="' + L + '" y="0" width="' + (W - L - R) + '" height="' + H + '" fill="transparent" id="hit"/></svg>';
    box.innerHTML = svg;
    var tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip);
    var el = box.querySelector("svg"), cx = box.querySelector("#cx"), cd = box.querySelector("#cd"), hit = box.querySelector("#hit");
    function move(ev) {
      var r = el.getBoundingClientRect();
      var px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * W;
      var t = t0 + Math.min(Math.max((px - L) / (W - L - R), 0), 1) * (t1 - t0);
      var cur = pts[0];
      for (var j = 0; j < pts.length; j++) if (pts[j].t <= t) cur = pts[j];
      var xs = X(Math.max(t, t0)), ys = Y(cur.p);
      cx.setAttribute("x1", xs); cx.setAttribute("x2", xs); cx.style.display = "";
      cd.setAttribute("cx", xs); cd.setAttribute("cy", ys); cd.style.display = "";
      tip.textContent = dmy(new Date(t).toISOString().slice(0, 10)) + ": " + fmt(cur.p);
      tip.style.display = "block";
      tip.style.left = (xs / W * r.width) + "px"; tip.style.top = (ys / H * r.height) + "px";
    }
    function out() { cx.style.display = "none"; cd.style.display = "none"; tip.style.display = "none"; }
    hit.addEventListener("mousemove", move); hit.addEventListener("mouseleave", out);
    hit.addEventListener("touchstart", move, { passive: true }); hit.addEventListener("touchmove", move, { passive: true });
    hit.addEventListener("touchend", out);
    return { pts: pts, mn: mn, mx: mx, first: first, last: last };
  }

  function buildDetail(item) {
    var box = document.createElement("div"); box.className = "detail"; box.hidden = true;
    var ctl = document.createElement("div"); ctl.className = "ctl";
    var cap = document.createElement("div"); cap.className = "note"; cap.style.margin = "0";
    cap.textContent = "Dữ liệu từ " + dmy(item.first) + ", " + item.hist.length + " ngày";
    var range = document.createElement("div"); range.className = "range";
    var chart = document.createElement("div"); chart.className = "chartbox";
    var stats = document.createElement("div"); stats.className = "stats";
    var cur = 92;
    [["1 tháng", 30], ["3 tháng", 92]].forEach(function (r) {
      var b = document.createElement("button"); b.textContent = r[0]; b.setAttribute("aria-pressed", r[1] === cur);
      b.addEventListener("click", function () {
        cur = r[1];
        range.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
        draw();
      });
      range.appendChild(b);
    });
    function draw() {
      var res = buildChart(chart, item, cur);
      stats.textContent = "";
      if (res.mn == null) return;
      var diff = res.last - res.first;
      [["Hiện tại", fmt(res.last)], ["Thấp nhất", fmt(res.mn)], ["Cao nhất", fmt(res.mx)],
       ["Thay đổi", (diff > 0 ? "+" : "") + fmt(diff)]].forEach(function (s) {
        var d = document.createElement("div"); d.textContent = s[0];
        var b = document.createElement("b"); b.textContent = s[1]; d.appendChild(b); stats.appendChild(d);
      });
    }
    var go = document.createElement("a"); go.className = "go"; go.href = item.url; go.target = "_blank"; go.rel = "noopener";
    go.textContent = "Xem trên " + data.source;
    ctl.append(cap, range); box.append(ctl, chart, stats, go);
    box.draw = draw;
    return box;
  }

  function render() {
    var q = state.q.trim().toLowerCase();
    var items = data.items.filter(function (i) {
      return (state.s === "all" || i.series === state.s) && (!q || i.name.toLowerCase().indexOf(q) !== -1);
    });
    var drop = function (i) { return i.prev ? i.prev - i.price : 0; };
    items.sort(function (a, b) {
      if (state.sort === "asc") return a.price - b.price;
      if (state.sort === "desc") return b.price - a.price;
      if (state.sort === "drop") return drop(b) - drop(a);
      return a.name.localeCompare(b.name, "vi");
    });
    list.textContent = "";
    if (!items.length) {
      var e = document.createElement("div"); e.className = "empty";
      e.textContent = "Không có card nào khớp. Thử bỏ bộ lọc hoặc đổi từ khóa.";
      list.appendChild(e); return;
    }
    items.forEach(function (i) {
      var it = document.createElement("article"); it.className = "item";
      var head = document.createElement("button"); head.className = "head"; head.setAttribute("aria-expanded", "false");
      var info = document.createElement("div");
      var name = document.createElement("div"); name.className = "name";
      var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = i.series;
      name.append(tag, document.createTextNode(clean(i.name)));
      var meta = document.createElement("div"); meta.className = "meta";
      var d = i.prev ? i.price - i.prev : 0;
      if (!i.prev) meta.textContent = "Mới theo dõi từ " + dmy(i.first);
      else if (d < 0) { meta.className += " down"; meta.textContent = "Giảm " + fmt(-d) + " so với lần trước"; }
      else if (d > 0) { meta.className += " up"; meta.textContent = "Tăng " + fmt(d) + " so với lần trước"; }
      else meta.textContent = "Giá không đổi";
      var since = document.createElement("div"); since.className = "meta";
      since.textContent = "Mức giá này có từ " + dmy(i.changed);
      if (i.prev) info.append(name, meta, since); else info.append(name, meta);
      var price = document.createElement("div"); price.className = "price";
      if (i.original) { var o = document.createElement("span"); o.className = "old"; o.textContent = fmt(i.original); price.appendChild(o); }
      price.appendChild(document.createTextNode(fmt(i.price)));
      head.append(thumb(i.image, "thumb"), info, price);
      var detail = buildDetail(i), drawn = false;
      head.addEventListener("click", function () {
        var open = detail.hidden;
        detail.hidden = !open; head.setAttribute("aria-expanded", open);
        if (open && !drawn) { detail.draw(); drawn = true; }
      });
      it.append(head, detail);
      list.appendChild(it);
    });
  }

  document.getElementById("tabs").addEventListener("click", function (e) {
    var btn = e.target.closest("button"); if (!btn) return;
    state.s = btn.dataset.s;
    this.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", b === btn); });
    render();
  });
  document.getElementById("q").addEventListener("input", function () { state.q = this.value; render(); });
  document.getElementById("sort").addEventListener("change", function () { state.sort = this.value; render(); });
  render();
})();
</script>
</body>
</html>
